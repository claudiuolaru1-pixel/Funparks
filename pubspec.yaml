name: funparks
description: A playful, map-first theme park discovery app (MVP).
version: 2.0.1+108
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: 0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  flutter_svg: ^2.0.9
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  url_launcher: ^6.3.0

  # Maps
  google_maps_flutter: ^2.7.0
  google_maps_flutter_android: ^2.18.0

  # Firebase
  firebase_core: ^3.5.0
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.3

  # Other
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
    - assets/data/parks/
    - assets/data/parks/portaventura/
    - assets/data/parks/altontowers/
    - assets/data/parks/europapark/
    - assets/data/parks/plopsaland/
    - assets/data/parks/gardaland/
    - assets/data/parks/parcasterix/
    - assets/data/parks/energylandia/
    - assets/data/parks/efteling/
    - assets/data/parks/phantasialand/
    - assets/data/parks/disneylandparis/
    - assets/data/parks/gronalund/
    - assets/data/parks/tivoli/
    - assets/data/parks/siampark/
    - assets/data/parks/toverland/
    - assets/data/parks/walibibelgium/
    - assets/data/parks/heidepark/
    - assets/data/parks/thorpepark/
    - assets/data/parks/moviepark/
    - assets/data/parks/lego_billund/
    - assets/data/parks/walibinl/
    - assets/data/parks/legoland_deutschland/
    - assets/data/parks/puydufou/
    - assets/data/parks/mirabilandia/
    - assets/data/parks/zoomarine/
    - assets/data/parks/parque_warner_madrid/
    - assets/data/parks/tokyo_disneyland/
    - assets/data/parks/shanghai_disneyland/
    - assets/data/parks/movie_world_australia/
    - assets/data/parks/gold_reef_city/
    - assets/data/parks/ferrari_world/
    - assets/data/parks/lotte_world/
    - assets/data/parks/sea_world_gold_coast/
    - assets/i18n/
    - assets/maps/
    - assets/images/
    - assets/splash/
    - assets/icons/
    
flutter_native_splash:
  color: "#72C8FF"
  color_dark: "#2A2A2A"
  image: assets/splash/splash_2732.png
  android_12:
    image: assets/splash/splash_2732.png
    icon_background_color: "#72C8FF"
  ios: true
  android: true

flutter_icons:
  android: true
  ios: true
  image_path: assets/icons/icon_1024.png
  adaptive_icon_background: "#72C8FF"
  adaptive_icon_foreground: assets/icons/icon_1024.png

