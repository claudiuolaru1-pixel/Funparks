name: funparks
description: A playful, map-first theme park discovery app (MVP).
version: 2.0.4+229
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  flutter_svg: ^2.0.9
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  url_launcher: ^6.3.0

  # Maps
  google_maps_flutter: ^2.7.0
  google_maps_flutter_android: ^2.14.13

  # Firebase
  firebase_core: ^4.9.0
  cloud_firestore: ^6.4.1
  firebase_auth: ^6.5.1
  firebase_storage: ^13.4.1

  # Other
  share_plus: ^10.0.2
  audioplayers: ^6.1.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

